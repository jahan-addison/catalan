services:
  # Native arch. To emulate x86_64 on Apple Silicon:
  # DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose up -d --build
  dev:
    build:
      context: .
      target: dev
    volumes:
      - .:/workspace
      # Keeps the container's build tree apart from a host build/
      - build:/workspace/build
      - cpm-cache:/root/.cache/CPM
    ports:
      - "18080:18080"
    # ptrace, for gdb and LeakSanitizer
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # Production smoke test, mirrors the deploy. The API is on APP_PORT, the
  # site on SITE_PORT:
  # docker compose --profile prod up -d --build proxy
  catalan:
    profiles: ["prod"]
    build:
      context: .
      target: runtime
    environment:
      # Cloudflare's test secret 1x0000000000000000000000000000000AA always
      # passes, empty turns the human check off
      CATALAN_TURNSTILE_SECRET: ${CATALAN_TURNSTILE_SECRET:-}
    volumes:
      - data:/data

  proxy:
    profiles: ["prod"]
    build:
      context: .
      target: proxy
      args:
        # empty uses frontend/.env.local, see .env.example
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    depends_on:
      - catalan
    ports:
      - "${APP_PORT:-18081}:80"
      - "${SITE_PORT:-18082}:8080"
    volumes:
      - caddy-data:/data

volumes:
  build:
  cpm-cache:
  data:
  caddy-data:
